<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meta Core Heropacks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <h1>META CORE</h1>
    <p>The Minecraft Bedrock superhero addon. Discover heropacks made by the community.</p>
  </header>
  <main>
    <section>
      <h2>Featured Heropacks</h2>
      <div class="carousel" id="carousel" aria-label="Featured heropacks"><div class="track" id="track"></div></div>
    </section>
    <section>
      <h2>Browse All Heropacks</h2>
      <input id="search" type="search" placeholder="Search by heropack or creator..." aria-label="Search heropacks">
      <div class="grid" id="grid"></div>
    </section>
  </main>
  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="close" id="close" aria-label="Close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>
  <footer>Meta Core &middot; Not affiliated with Mojang or Microsoft.</footer>
  <script src="js/app.js"></script>
</body>
</html>
