services:
  - type: web
    name: meta-core-heropacks
    runtime: node
    buildCommand: npm install && npm install --prefix client --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      # Set in the Render dashboard, e.g. {"example-creator-1":"their-secret-code"}
      - key: CREATOR_CODES
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
